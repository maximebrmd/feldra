version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']

  # The root Bun lockfile covers all workspaces, including feldra.
  # packages/feldra/variants/clerk/package-lock.json is regenerated by packaging.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
