version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']

  # The root npm lockfile covers all workspaces, including the initializer.
  # initializer/variants/clerk/package-lock.json is regenerated by packaging.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
