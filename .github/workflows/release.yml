name: Release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run release:version
          pr-title: 'Release feldra'
          commit-message: 'chore: version feldra'
      - uses: actions/download-artifact@v8
        if: steps.changesets.outputs.has-changesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
        with:
          name: initializer
          path: release-artifact
      - name: Require current translations before publishing
        if: steps.changesets.outputs.has-changesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
        run: bun run docs:translations:check
      - name: Publish the tested tarball and create GitHub release
        if: steps.changesets.outputs.has-changesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./packages/feldra/package.json').version")
          tag="feldra@$version"
          artifact="release-artifact/feldra-$version.tgz"
          cd release-artifact
          sha256sum --check SHA256SUMS
          cd ..
          # Fail on registry/network errors; only a genuine 404 permits publish.
          status=$(curl --silent --show-error --output /tmp/npm-version.json --write-out '%{http_code}' "https://registry.npmjs.org/feldra/$version")
          case "$status" in
            200) echo "feldra@$version is already published"; exit 0 ;;
            404) npm publish "$artifact" --access public --provenance ;;
            *) cat /tmp/npm-version.json; exit 1 ;;
          esac
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" "$artifact" release-artifact/SHA256SUMS \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
