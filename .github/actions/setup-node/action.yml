name: Set up Feldra
description: Install the supported Node runtime and locked npm dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - shell: bash
      run: npm install --global npm@11.19.1
    - shell: bash
      run: npm ci --no-fund
