name: Set up Feldra
description: Install the supported Node and Bun runtimes and locked dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - shell: bash
      run: bun install --frozen-lockfile
